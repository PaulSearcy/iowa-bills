<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iowa Legislature Floor Votes</title>
    <link rel="stylesheet" href="app.css">
    <script src="js/votes.js"></script>
    <style>
        :root {
            --cell-w: 2.35rem;
            --cell-h: 2.35rem;
            --row-head-w: 8.5rem;
            --col-head-h: 10rem;
            --bill-row-h: 3.4rem;
        }

        .container {
            max-width: 100%;
        }

        .stats {
            display: flex;
            gap: 1.5rem;
        }

        .table-wrapper {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: auto;
            min-height: 20rem;
            max-height: 80vh;
        }

        .table-wrapper table {
            margin: 0;
            border-collapse: collapse;
            table-layout: fixed;
            width: max-content;
            font-size: 0.8125rem;
            font-variant-numeric: tabular-nums;
        }

        th, td {
            box-sizing: border-box;
            padding: 0.35rem 0.2rem;
            text-align: center;
            border: 1px solid var(--line);
            width: var(--cell-w);
            min-width: var(--cell-w);
            max-width: var(--cell-w);
            height: var(--cell-h);
            overflow: hidden;
        }

        thead th:not(.scroll-pad) {
            height: var(--col-head-h);
            background: var(--bg);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: var(--z-sticky);
        }

        th.row-header,
        td.row-header,
        th.corner {
            width: var(--row-head-w);
            min-width: var(--row-head-w);
            max-width: var(--row-head-w);
            text-align: left;
            padding: 0.35rem 0.55rem;
        }

        th.row-header {
            position: sticky;
            left: 0;
            z-index: var(--z-sticky-col);
            background: oklch(0.945 0.008 248);
        }

        th.corner {
            position: sticky;
            left: 0;
            top: 0;
            z-index: var(--z-sticky-corner);
            background: oklch(0.93 0.01 248);
        }

        td.row-header {
            position: sticky;
            left: 0;
            z-index: var(--z-sticky-row);
            background: var(--surface);
            font-weight: 500;
        }

        tr.bill-row td {
            height: var(--bill-row-h);
        }

        .vote-yea {
            background: var(--yea-bg);
            color: var(--yea);
            font-weight: 500;
        }

        .vote-nay {
            background: var(--nay-bg);
            color: var(--nay);
            font-weight: 500;
        }

        .vote-absent {
            background: var(--absent-bg);
            color: var(--absent);
        }

        .vote-none,
        .vote-dim {
            background: var(--surface);
            color: var(--ink-muted);
        }

        thead th.party-d,
        td.row-header.party-d {
            background: var(--party-d-bg);
            color: var(--party-d);
        }

        thead th.party-r,
        td.row-header.party-r {
            background: var(--party-r-bg);
            color: var(--party-r);
        }

        .bill-title {
            display: block;
            font-size: 0.6875rem;
            font-weight: 400;
            color: var(--ink-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-rotated {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            height: calc(var(--col-head-h) - 0.7rem);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }

        th.scroll-pad,
        td.scroll-pad {
            padding: 0;
            border: none;
            background: transparent;
            height: auto;
            max-width: none;
        }

        tr.scroll-pad-row,
        tr.scroll-pad-row td {
            padding: 0;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 id="page-title">Iowa Legislature Floor Votes</h1>
            <p class="subtitle" id="page-subtitle">Floor votes on bills — comparison table</p>
        </header>
        
        <div class="controls">
            <div class="control-group">
                <label for="session-select">Session</label>
                <select id="session-select" onchange="setSession(this.value)">
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                </select>
            </div>

            <div class="control-group">
                <span id="view-label">View</span>
                <div class="seg" role="group" aria-labelledby="view-label">
                    <button type="button" id="btn-view-table" class="active" onclick="switchView('table')">Table</button>
                    <button type="button" id="btn-view-list" onclick="switchView('list')">List</button>
                </div>
            </div>

            <div class="control-group">
                <span id="chamber-label">Chamber</span>
                <div class="seg chamber-toggle" role="group" aria-labelledby="chamber-label">
                    <button type="button" id="btn-house" class="active" onclick="setChamber('House')">House</button>
                    <button type="button" id="btn-senate" onclick="setChamber('Senate')">Senate</button>
                    <button type="button" id="btn-both" onclick="setChamber('Both')">Both</button>
                </div>
            </div>
            
            <div class="control-group">
                <label for="vote-type">Show</label>
                <select id="vote-type" onchange="renderTable()">
                    <option value="yeas">Yea votes</option>
                    <option value="nays">Nay votes</option>
                    <option value="all">All votes</option>
                </select>
            </div>
            
            <div class="control-group">
                <button type="button" onclick="swapAxis()" class="btn toggle-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/>
                    </svg>
                    Swap axes
                </button>
            </div>
            
            <div class="control-group">
                <label for="filter-input">Members</label>
                <input type="text" id="filter-input" placeholder="Name, D, Republican…" oninput="debounceRender()">
            </div>
        </div>
        
        <div class="stats" id="stats"></div>
        
        <div class="legend" aria-label="Vote legend">
            <div class="legend-item">
                <span class="legend-swatch yea"></span>
                <span>Yea</span>
            </div>
            <div class="legend-item">
                <span class="legend-swatch nay"></span>
                <span>Nay</span>
            </div>
            <div class="legend-item">
                <span class="legend-swatch absent"></span>
                <span>Absent / not voting</span>
            </div>
            <div class="legend-item">
                <span class="legend-swatch none"></span>
                <span>Did not participate</span>
            </div>
            <div class="legend-item">
                <span class="legend-party party-d">D</span>
                <span>Democrat</span>
            </div>
            <div class="legend-item">
                <span class="legend-party party-r">R</span>
                <span>Republican</span>
            </div>
        </div>
        
        <div class="table-wrapper" id="table-container">
            <div class="loading">Loading vote data...</div>
        </div>
    </div>

    <script>
        let billsOnRows = true;
        let currentSession = '2026';
        let currentChamber = 'House';
        let filterTimeout = null;
        let scrollRaf = 0;
        let gridBuilt = false;
        let lastWindowKey = '';
        let metrics = null;
        const OVERSCAN = 6;
        const cache = {
            membersByChamber: {},
            votesByChamber: {},
            voteLookup: new Map()
        };
        const grid = {
            bills: [],
            members: [],
            voteType: 'yeas'
        };

        function precomputeData() {
            const votes = voteData.votes || [];

            cache.votesByChamber = {
                House: [],
                Senate: [],
                Both: votes
            };

            votes.forEach(vote => {
                if (vote.chamber === 'House') cache.votesByChamber.House.push(vote);
                else if (vote.chamber === 'Senate') cache.votesByChamber.Senate.push(vote);
            });

            const memberMaps = { House: new Map(), Senate: new Map(), Both: new Map() };

            votes.forEach(vote => {
                const voteId = `${vote.chamber}-${vote.legislation}-${vote.date}`;
                const lookup = new Map();

                const processVoters = (list, voteType) => {
                    if (!list) return;
                    list.forEach(m => {
                        lookup.set(m.name, voteType);
                        const memberData = { name: m.name, party: m.party, partyAbbr: m.partyAbbr };
                        memberMaps.Both.set(m.name, memberData);
                        if (vote.chamber === 'House') memberMaps.House.set(m.name, memberData);
                        else if (vote.chamber === 'Senate') memberMaps.Senate.set(m.name, memberData);
                    });
                };

                processVoters(vote.voteDetails?.yeas, 'yea');
                processVoters(vote.voteDetails?.nays, 'nay');
                processVoters(vote.voteDetails?.absentOrNotVoting, 'absent');

                cache.voteLookup.set(voteId, lookup);
            });

            const sortMembers = (map) => Array.from(map.values()).sort((a, b) => {
                if (a.partyAbbr !== b.partyAbbr) return a.partyAbbr === 'D' ? -1 : 1;
                return a.name.localeCompare(b.name);
            });

            cache.membersByChamber = {
                House: sortMembers(memberMaps.House),
                Senate: sortMembers(memberMaps.Senate),
                Both: sortMembers(memberMaps.Both)
            };
        }

        function setChamber(chamber) {
            currentChamber = chamber;
            setChamberUI(chamber);
            setUrlState(currentSession, currentChamber);
            renderTable();
        }

        function swapAxis() {
            billsOnRows = !billsOnRows;
            renderTable();
        }

        function debounceRender() {
            clearTimeout(filterTimeout);
            filterTimeout = setTimeout(renderTable, 150);
        }

        function getFilteredMembers() {
            const allMembers = cache.membersByChamber[currentChamber] || [];
            const filterText = document.getElementById('filter-input').value.toLowerCase().trim();

            if (!filterText) return allMembers;

            return allMembers.filter(m =>
                m.name.toLowerCase().includes(filterText) ||
                (m.party || '').toLowerCase().includes(filterText) ||
                (m.partyAbbr || '').toLowerCase() === filterText
            );
        }

        function getMemberVote(vote, memberName) {
            const voteId = `${vote.chamber}-${vote.legislation}-${vote.date}`;
            const lookup = cache.voteLookup.get(voteId);
            return lookup?.get(memberName) || 'none';
        }

        function readMetrics() {
            const cs = getComputedStyle(document.documentElement);
            const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
            const read = (name) => {
                const value = cs.getPropertyValue(name).trim();
                if (value.endsWith('rem')) return parseFloat(value) * rem;
                return parseFloat(value);
            };
            return {
                cellW: read('--cell-w'),
                cellH: read('--cell-h'),
                rowHeadW: read('--row-head-w'),
                colHeadH: read('--col-head-h'),
                billRowH: read('--bill-row-h')
            };
        }

        function ensureGrid() {
            const wrap = document.getElementById('table-container');
            if (!wrap.dataset.scrollBound) {
                wrap.addEventListener('scroll', onTableScroll, { passive: true });
                wrap.dataset.scrollBound = '1';
            }
            if (gridBuilt && wrap.querySelector('#vote-grid')) return wrap;

            wrap.innerHTML = '<table id="vote-grid"></table>';
            gridBuilt = true;
            lastWindowKey = '';
            return wrap;
        }

        function onTableScroll() {
            if (scrollRaf) return;
            scrollRaf = requestAnimationFrame(() => {
                scrollRaf = 0;
                renderWindow();
            });
        }

        function renderTable() {
            const wrap = document.getElementById('table-container');
            const votes = cache.votesByChamber[currentChamber] || [];
            const voteType = document.getElementById('vote-type').value;

            if (votes.length === 0) {
                gridBuilt = false;
                lastWindowKey = '';
                wrap.innerHTML = '<div class="loading">No votes found for this chamber.</div>';
                document.getElementById('stats').innerHTML = '';
                return;
            }

            const members = getFilteredMembers();

            if (members.length === 0) {
                gridBuilt = false;
                lastWindowKey = '';
                wrap.innerHTML = '<div class="loading">No members match your filter.</div>';
                document.getElementById('stats').innerHTML = '';
                return;
            }

            const bills = votes.map(v => ({
                id: v.legislation,
                title: v.legislationTitle,
                chamber: v.chamber,
                date: v.date,
                vote: v
            }));

            document.getElementById('stats').innerHTML = `
                <span><strong>${bills.length}</strong> bills</span>
                <span><strong>${members.length}</strong> legislators</span>
            `;

            grid.bills = bills;
            grid.members = members;
            grid.voteType = voteType;
            metrics = readMetrics();
            lastWindowKey = '';

            const scroller = ensureGrid();
            const table = document.getElementById('vote-grid');
            const colCount = billsOnRows ? members.length : bills.length;
            table.style.width = `${metrics.rowHeadW + colCount * metrics.cellW}px`;
            scroller.scrollTop = 0;
            scroller.scrollLeft = 0;
            lastWindowKey = '';
            renderWindow();
            requestAnimationFrame(() => {
                lastWindowKey = '';
                renderWindow();
            });
        }

        function padCell(tag, width) {
            if (width < 0.5) return '';
            return `<${tag} class="scroll-pad" style="width:${width}px;min-width:${width}px;max-width:${width}px"></${tag}>`;
        }

        function renderWindow() {
            const wrap = document.getElementById('table-container');
            const table = document.getElementById('vote-grid');
            if (!wrap || !table || !metrics) return;

            const { bills, members, voteType } = grid;
            const rowItems = billsOnRows ? bills : members;
            const colItems = billsOnRows ? members : bills;
            const rowH = billsOnRows ? metrics.billRowH : metrics.cellH;
            const { cellW, rowHeadW, colHeadH } = metrics;

            const colStart = Math.max(0, Math.floor(wrap.scrollLeft / cellW) - OVERSCAN);
            const colEnd = Math.min(
                colItems.length,
                Math.ceil((wrap.scrollLeft + Math.max(wrap.clientWidth - rowHeadW, cellW)) / cellW) + OVERSCAN
            );
            const rowStart = Math.max(0, Math.floor(wrap.scrollTop / rowH) - OVERSCAN);
            const rowEnd = Math.min(
                rowItems.length,
                Math.ceil((wrap.scrollTop + Math.max(wrap.clientHeight - colHeadH, rowH)) / rowH) + OVERSCAN
            );

            const key = `${billsOnRows}|${voteType}|${rowStart}:${rowEnd}|${colStart}:${colEnd}|${rowItems.length}x${colItems.length}`;
            if (key === lastWindowKey) return;
            lastWindowKey = key;

            const leftPad = colStart * cellW;
            const rightPad = (colItems.length - colEnd) * cellW;
            const topPad = rowStart * rowH;
            const bottomPad = (rowItems.length - rowEnd) * rowH;
            const colSpan = 1 + (leftPad > 0.5 ? 1 : 0) + (colEnd - colStart) + (rightPad > 0.5 ? 1 : 0);

            const headerCells = [`<th class="corner">${billsOnRows ? 'Bill' : 'Member'}</th>`];
            headerCells.push(padCell('th', leftPad));
            for (let c = colStart; c < colEnd; c += 1) {
                if (billsOnRows) {
                    const m = members[c];
                    const partyClass = m.partyAbbr === 'D' ? 'party-d' : m.partyAbbr === 'R' ? 'party-r' : '';
                    const label = `${escapeHtml(m.name)}${m.partyAbbr ? ` (${escapeHtml(m.partyAbbr)})` : ''}`;
                    headerCells.push(`<th class="${partyClass}"><div class="header-rotated">${label}</div></th>`);
                } else {
                    const bill = bills[c];
                    headerCells.push(`<th title="${escapeHtml(bill.title)}"><div class="header-rotated">${escapeHtml(bill.id)}</div></th>`);
                }
            }
            headerCells.push(padCell('th', rightPad));

            const rows = [`<thead><tr>${headerCells.join('')}</tr></thead><tbody>`];
            if (topPad > 0.5) {
                rows.push(`<tr class="scroll-pad-row" style="height:${topPad}px"><td class="scroll-pad" colspan="${colSpan}"></td></tr>`);
            }

            const rowClass = billsOnRows ? ' class="bill-row"' : '';
            for (let r = rowStart; r < rowEnd; r += 1) {
                if (billsOnRows) {
                    const bill = bills[r];
                    const cells = [`<td class="row-header" title="${escapeHtml(bill.title)}">${escapeHtml(bill.id)}<br><span class="bill-title">${escapeHtml(bill.chamber)} - ${escapeHtml(bill.date)}</span></td>`];
                    cells.push(padCell('td', leftPad));
                    for (let c = colStart; c < colEnd; c += 1) {
                        const voteResult = getMemberVote(bill.vote, members[c].name);
                        cells.push(`<td class="${getVoteCellClass(voteResult, voteType)}">${getVoteDisplay(voteResult, voteType)}</td>`);
                    }
                    cells.push(padCell('td', rightPad));
                    rows.push(`<tr${rowClass}>${cells.join('')}</tr>`);
                } else {
                    const m = members[r];
                    const partyClass = m.partyAbbr === 'D' ? 'party-d' : m.partyAbbr === 'R' ? 'party-r' : '';
                    const cells = [`<td class="row-header ${partyClass}">${escapeHtml(m.name)}${m.partyAbbr ? ` (${escapeHtml(m.partyAbbr)})` : ''}</td>`];
                    cells.push(padCell('td', leftPad));
                    for (let c = colStart; c < colEnd; c += 1) {
                        const voteResult = getMemberVote(bills[c].vote, m.name);
                        cells.push(`<td class="${getVoteCellClass(voteResult, voteType)}">${getVoteDisplay(voteResult, voteType)}</td>`);
                    }
                    cells.push(padCell('td', rightPad));
                    rows.push(`<tr>${cells.join('')}</tr>`);
                }
            }

            if (bottomPad > 0.5) {
                rows.push(`<tr class="scroll-pad-row" style="height:${bottomPad}px"><td class="scroll-pad" colspan="${colSpan}"></td></tr>`);
            }
            rows.push('</tbody>');
            table.innerHTML = rows.join('');
        }

        function getVoteCellClass(voteResult, voteType) {
            if (voteType === 'yeas') return voteResult === 'yea' ? 'vote-yea' : 'vote-dim';
            if (voteType === 'nays') return voteResult === 'nay' ? 'vote-nay' : 'vote-dim';
            return `vote-${voteResult}`;
        }

        function getVoteDisplay(voteResult, voteType) {
            if (voteType === 'all') {
                if (voteResult === 'yea') return 'Y';
                if (voteResult === 'nay') return 'N';
                if (voteResult === 'absent') return 'A';
                return '–';
            } else if (voteType === 'yeas') {
                return voteResult === 'yea' ? 'Y' : '';
            } else if (voteType === 'nays') {
                return voteResult === 'nay' ? 'N' : '';
            }
            return '';
        }

        async function init() {
            const state = getUrlState();
            currentSession = state.session;
            currentChamber = state.chamber;
            document.getElementById('session-select').value = currentSession;
            document.getElementById('page-title').textContent = `Iowa Legislature ${currentSession} Session`;
            document.getElementById('page-subtitle').textContent = 'Floor votes on bills — comparison table';
            document.title = `Iowa Legislature ${currentSession} - Floor Votes Table`;
            setChamberUI(currentChamber);
            setUrlState(currentSession, currentChamber);

            try {
                await loadVoteData(currentSession);
                precomputeData();
                renderTable();
            } catch (error) {
                gridBuilt = false;
                document.getElementById('table-container').innerHTML =
                    `<div class="loading">Error: could not load ${SESSION_FILES[currentSession]}</div>`;
            }
        }

        window.addEventListener('resize', () => {
            if (!gridBuilt) return;
            metrics = readMetrics();
            lastWindowKey = '';
            renderWindow();
        });

        init();
    </script>
</body>
</html>
