function race([dn, dv, rn, rv, writeIn, others = []]) {
  const D = dn ? { name: dn, party: "D", votes: dv } : null, R = rn ? { name: rn, party: "R", votes: rv } : null;
  const field = [D, R, ...others.map(([name, votes]) => ({ name, party: "I", votes }))].filter(Boolean).sort((a, b) => b.votes - a.votes);
  const cast = field.reduce((s, c) => s + c.votes, 0) + writeIn;
  const [winner, runnerUp = null] = field;
  for (const c of field) { c.pct = (c.votes / cast) * 100; c.won = c === winner; }
  const margin = winner.votes - (runnerUp?.votes ?? writeIn);
  return {
    D, R, field, writeIn, cast, winner, runnerUp, margin, marginPct: (margin / cast) * 100,
    contested: !!D && !!R,
    // Positive when the Democrat led, negative when the Republican led.
    dLead: (((D?.votes ?? 0) - (R?.votes ?? 0)) / cast) * 100,
  };
}

  </div>`;
function renderPanel() {
  const k = mstate.hover ?? mstate.pinned;
  const d = k && byKey.get(k);
  hovPath.setAttribute("d", mstate.hover && mstate.hover !== mstate.pinned ? SHAPES[mstate.hover] : "");
  selPath.setAttribute("d", mstate.pinned ? SHAPES[mstate.pinned] : "");
  if (!d) { mpanel.innerHTML = `<p class="small muted">Hover over or tap a ${UNIT} to compare its ${Y0} and ${Y1} results and see which way it moved.</p>`; return; }
  const shift = d.comparable ? `
    <div class="mc">
      <span class="shiftv ${PARTY_CLASS[toward(d.shift)]}">${Math.abs(d.shift).toFixed(1)} pts toward ${towardWord(d.shift)}</span>
      <span class="small muted num">${leanText(d.a.dLead)} in ${Y0} to ${leanText(d.b.dLead)} in ${Y1}</span>
      ${trackHtml(d)}
      <div class="tl"><span>D +${RANGE}</span><span>Tie</span><span>R +${RANGE}</span></div>
    </div>` : `<p class="small muted">No shift measured: there was no Democrat vs. Republican race in ${missingYears(d)}.</p>`;
  const flip = d.flipped ? `<p class="small"><span class="tag flip-${d.b.winner.party}" style="margin-left:0">flipped</span> ${PARTY_NAME[d.a.winner.party]} in ${Y0}, ${PARTY_NAME[d.b.winner.party]} in ${Y1}</p>` : "";
  const sub = PAGE.panelSub ? `<p class="small muted">${PAGE.panelSub(d)}</p>` : "";
  mpanel.innerHTML = `
    <div><h3 style="margin:0">${esc(PAGE.name(d.k))}</h3>${sub}${flip}</div>
    ${shift}
    ${yearHtml(Y0, d.a)}${yearHtml(Y1, d.b)}
    <div class="line small"><span class="muted">Votes cast</span><span class="num">${num(d.a.cast)} to ${num(d.b.cast)} <span class="faint">(${turnoutText(d.turnout)})</span></span></div>`;
}
msvg.addEventListener("pointerover", (e) => { if (e.pointerType === "mouse") { mstate.hover = keyOf(e); renderPanel(); } });
msvg.addEventListener("pointerleave", (e) => {
  // Touch ends often fire pointerleave; keep the pinned panel visible.
  if (e.pointerType === "touch") return;
  mstate.hover = null; renderPanel();
});
msvg.addEventListener("click", (e) => {
  if (touchHandled) { touchHandled = false; return; }
  const k = keyOf(e); if (k && !dragged) mapPin(k);
});
msvg.addEventListener("focusin", (e) => { mstate.hover = keyOf(e); renderPanel(); });
msvg.addEventListener("focusout", () => { mstate.hover = null; renderPanel(); });
msvg.addEventListener("keydown", (e) => {
  const k = keyOf(e);
  if (k && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); mapPin(k); }
});
function mapPin(k) { mstate.pinned = k; renderPanel(); }
function showOnMap(k) {
  mapPin(k);
  mapEl.scrollIntoView({ behavior: reduceMotion.matches ? "auto" : "smooth", block: "center" });
}
paint();

// Table
const state = { filter: "all", sort: "key", q: "" };
const FILTERS = [["all", "All"], ["comparable", "D vs. R both years"], ["flipped", "Flipped"], ["toD", "Moved toward D"], ["toR", "Moved toward R"], ["none", "No shift measured"]]
  .filter(([k]) => unmeasured || (k !== "comparable" && k !== "none"));
const matches = (d, k) => k === "all" ? true
  : k === "comparable" ? d.comparable
  : k === "flipped" ? d.flipped
  : k === "toD" ? d.comparable && d.shift > 0
  : k === "toR" ? d.comparable && d.shift < 0
  : !d.comparable;
const count = (k) => UNITS.filter((d) => matches(d, k)).length;
const pills = document.getElementById("pills");
function renderPills() {
  pills.innerHTML = FILTERS.map(([k, l]) => `<button type="button" class="pill${state.filter === k ? " active" : ""}" data-f="${k}" aria-pressed="${state.filter === k}">${l} (${count(k)})</button>`).join("");
}
pills.addEventListener("click", (e) => { const k = e.target.closest("[data-f]")?.dataset.f; if (k) { state.filter = k; renderPills(); renderRows(); } });
const unmeasuredLast = (a, b) => (a.comparable ? 0 : 1) - (b.comparable ? 0 : 1);
const unopposedLast = (a, b) => (a.b.runnerUp ? 0 : 1) - (b.b.runnerUp ? 0 : 1);
const SORTS = {
  key: [`Sort: ${PAGE.kind === "county" ? "county name" : "district number"}`, byKeyOrder],
  toD: ["Sort: biggest shift toward D", (a, b) => unmeasuredLast(a, b) || b.shift - a.shift],
  toR: ["Sort: biggest shift toward R", (a, b) => unmeasuredLast(a, b) || a.shift - b.shift],
  close1: [`Sort: closest ${Y1} result`, (a, b) => unopposedLast(a, b) || a.b.marginPct - b.b.marginPct],
  turnout: ["Sort: biggest drop in votes cast", (a, b) => a.turnout - b.turnout],
};
const sortSel = document.getElementById("sort");
sortSel.innerHTML = Object.entries(SORTS).map(([k, [l]]) => `<option value="${k}">${esc(l)}</option>`).join("");
const W_COL = PAGE.winnerWord;
document.getElementById("thead").innerHTML = `<th>${esc(PAGE.colUnit)}</th><th>${Y0} ${W_COL}</th><th class="r">${Y0} margin</th><th>${Y1} ${W_COL}</th><th class="r">${Y1} margin</th><th class="r">Shift</th><th class="r">Votes cast ${Y0}</th><th class="r">Votes cast ${Y1}</th><th class="r">Change</th>`;
const winnerCell = (y, r, tag = "") => `<td data-l="${y}: "><i class="sw" style="background:${partyVar(r.winner.party)}"></i>${esc(r.winner.name)}${tag}</td>`;
function renderRows() {
  const qv = state.q.trim().toLowerCase();
  let list = UNITS.filter((d) => matches(d, state.filter));
  if (qv) list = list.filter((d) => `${PAGE.name(d.k)} ${PAGE.short(d.k)} ${subLabel(d)} ${[...d.a.field, ...d.b.field].map((c) => c.name).join(" ")}`.toLowerCase().includes(qv));
  list.sort(SORTS[state.sort][1]);
  document.getElementById("rows").innerHTML = list.map((d) => `<tr>
    <td>${unitLink(d)}</td>
    ${winnerCell(Y0, d.a)}<td class="r">${resultShort(d.a)}</td>
    ${winnerCell(Y1, d.b, flipTag(d))}<td class="r">${resultShort(d.b)}</td>
    <td class="r">${shiftHtml(d)}</td>
    <td class="r num">${num(d.a.cast)}</td><td class="r num">${num(d.b.cast)}</td>
    <td class="r num muted" data-l="Votes cast vs. ${Y0}: ">${turnoutText(d.turnout)}</td></tr>`).join("") || '<tr><td colspan="9" class="faint">No matches.</td></tr>';
}
const openUnit = (e) => {
  const k = e.target.closest?.("[data-k]")?.dataset.k;
  if (k) showOnMap(k);
};
const openOnKey = (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.closest?.("[data-k]")) { e.preventDefault(); openUnit(e); } };
for (const id of ["rows", "swing"]) {
  document.getElementById(id).addEventListener("click", openUnit);
  document.getElementById(id).addEventListener("keydown", openOnKey);
}
q.addEventListener("input", (e) => { state.q = e.target.value; renderRows(); });
sortSel.addEventListener("change", (e) => { state.sort = e.target.value; renderRows(); });

renderPills(); renderRows();
const lead = [...flips].filter((d) => d.comparable).sort((a, b) => b.shift - a.shift)[0] ?? [...comp].sort((a, b) => b.shift - a.shift)[0];
mapPin(lead.k);
})();
</script>
</body>
</html>
