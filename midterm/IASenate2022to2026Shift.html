const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (n) => Math.round(n).toLocaleString("en-US");
const cap = (s) => s[0].toUpperCase() + s.slice(1);
const lastName = (s) => s.replace(/\b(Jr|Sr|II|III)\b\.?/g, "").trim().split(/\s+/).pop();
const PARTY_CLASS = { D: "gap-d", R: "gap-r", I: "" };
const PARTY_NAME = { D: "Democrat", R: "Republican", I: "No party" };
const Y0 = PAGE.from, Y1 = PAGE.to;
const UNIT = PAGE.unit, UNITS_WORD = PAGE.units;

function race([dn, dv, rn, rv, writeIn, others = []]) {
  const D = dn ? { name: dn, party: "D", votes: dv } : null, R = rn ? { name: rn, party: "R", votes: rv } : null;
  const field = [D, R, ...others.map(([name, votes]) => ({ name, party: "I", votes }))].filter(Boolean).sort((a, b) => b.votes - a.votes);
  const cast = field.reduce((s, c) => s + c.votes, 0) + writeIn;
  const [winner, runnerUp = null] = field;
  for (const c of field) { c.pct = (c.votes / cast) * 100; c.won = c === winner; }
  const margin = winner.votes - (runnerUp?.votes ?? writeIn);
  return {
    D, R, field, writeIn, cast, winner, runnerUp, margin, marginPct: (margin / cast) * 100,
    contested: !!D && !!R,
    // Positive when the Democrat led, negative when the Republican led.
    dLead: (((D?.votes ?? 0) - (R?.votes ?? 0)) / cast) * 100,
  };
}
const compare = (a, b) => {
  const comparable = a.contested && b.contested;
  return { a, b, comparable, shift: comparable ? b.dLead - a.dLead : null, flipped: a.winner.party !== b.winner.party, turnout: ((b.cast - a.cast) / a.cast) * 100 };
};

const SHAPES = PAGE.kind === "county" ? MAP.counties : MAP.districts;
const KEYS = Object.keys(SHAPES);
const UNITS = KEYS.filter((k) => FROM[k] && TO[k]).map((k) => ({ k, ...compare(race(FROM[k]), race(TO[k])) }));
const byKey = new Map(UNITS.map((d) => [d.k, d]));
const comp = UNITS.filter((d) => d.comparable);
const summary = SUMMARY.map(([label, f, t]) => ({ label, ...compare(race(f), race(t)) }));
const unmeasured = UNITS.length - comp.length;
const offCount = KEYS.length - UNITS.length;

const toward = (s) => (s > 0 ? "D" : "R");
const towardWord = (s) => (s > 0 ? "Democrats" : "Republicans");
const leanText = (m) => Math.abs(m) < 0.05 ? "Tied" : `${m > 0 ? "D" : "R"} +${Math.abs(m).toFixed(1)}`;
const leanHtml = (m) => `<span class="num ${Math.abs(m) < 0.05 ? "" : PARTY_CLASS[toward(m)]}">${leanText(m)}</span>`;
const shiftText = (d) => `${toward(d.shift)} +${Math.abs(d.shift).toFixed(1)}`;
const shiftHtml = (d) => !d.comparable ? '<span class="faint" title="No Democrat vs. Republican race in one of the years">n/a</span>'
  : `<span class="num ${PARTY_CLASS[toward(d.shift)]}">${shiftText(d)}</span>`;
const resultShort = (r) => !r.runnerUp ? `<span class="faint">${r.winner.party} unopposed</span>`
  : `<span class="num ${PARTY_CLASS[r.winner.party]}">${r.winner.party} +${r.marginPct.toFixed(1)}</span>`;
const flipTag = (d) => d.flipped ? `<span class="tag flip-${d.b.winner.party}" title="${PARTY_NAME[d.a.winner.party]} in ${Y0}, ${PARTY_NAME[d.b.winner.party]} in ${Y1}">flipped</span>` : "";
const missingYears = (d) => [!d.a.contested && Y0, !d.b.contested && Y1].filter(Boolean).join(" and ");
const median = (xs) => { const s = [...xs].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const turnoutText = (t) => `${t > 0 ? "+" : t < 0 ? "\u2212" : ""}${Math.abs(t).toFixed(0)}%`;

    const [a0, b0] = ids.slice(0, 2).map((id) => gesture.pts.get(id)), [a1, b1] = ids.slice(0, 2).map((id) => pointers.get(id));
    const factor = Math.hypot(b1[0] - a1[0], b1[1] - a1[1]) / Math.max(1, Math.hypot(b0[0] - a0[0], b0[1] - a0[1]));
    const m0 = [(a0[0] + b0[0]) / 2, (a0[1] + b0[1]) / 2], m1 = [(a1[0] + b1[0]) / 2, (a1[1] + b1[1]) / 2];
    const anchor = [gesture.view.x + (m0[0] - r.left) * u, gesture.view.y + (m0[1] - r.top) * u];
    const z = zoomAround(gesture.view, anchor, factor), u2 = z.w / r.width;
    setView({ w: z.w, x: anchor[0] - (m1[0] - r.left) * u2, y: anchor[1] - (m1[1] - r.top) * u2 });
    dragged = true;
  } else if (ids.length === 1) {
    const [sx, sy] = gesture.pts.get(ids[0]), [cx, cy] = pointers.get(ids[0]);
    if (Math.hypot(cx - sx, cy - sy) > dragSlop(e.pointerType)) dragged = true;
    if (dragged && (e.pointerType !== "touch" || mapEl.classList.contains("zoomed"))) {
      msvg.classList.add("dragging");
      setView({ w: gesture.view.w, x: gesture.view.x - (cx - sx) * u, y: gesture.view.y - (cy - sy) * u });
    }
  }
});
const endPointer = (e) => {
  pointers.delete(e.pointerId);
  msvg.classList.remove("dragging");
  gesture = pointers.size ? { view: { ...view }, pts: new Map(pointers) } : null;
};
msvg.addEventListener("pointerup", (e) => {
  // Pin on touch-up so a tap still works when iOS skips click after slight movement.
  if (e.pointerType === "touch" && pointers.has(e.pointerId) && !dragged && pointers.size === 1) {
    const k = keyOf(e) ?? keyAtPoint(e.clientX, e.clientY);
    if (k) { mapPin(k); touchHandled = true; }
  }
  endPointer(e);
});
msvg.addEventListener("pointercancel", endPointer);
msvg.addEventListener("wheel", (e) => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  cancelAnimationFrame(anim);
  setView(zoomAround(view, svgPoint(e.clientX, e.clientY), Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.002))));
}, { passive: false });
msvg.addEventListener("dblclick", (e) => { e.preventDefault(); animateTo(zoomAround(view, svgPoint(e.clientX, e.clientY), 2)); });
document.getElementById("zin").addEventListener("click", () => animateTo(zoomAround(view, center(), 2)));
document.getElementById("zout").addEventListener("click", () => animateTo(zoomAround(view, center(), 0.5)));
document.getElementById("zreset").addEventListener("click", () => animateTo({ x: 0, y: 0, w: W }));
new ResizeObserver(applyView).observe(msvg);

// Areas: zoom to fit the units around each city.
const AREAS = PAGE.areas ?? [];
const marea = document.getElementById("marea");
marea.hidden = !AREAS.length;
marea.innerHTML = `<option value="" hidden>Zoom to an area</option>` + AREAS.map(([label], i) => `<option value="${i}">${esc(label)}</option>`).join("");
const clearArea = () => { marea.value = ""; };
function fitKeys(keys) {
  if (!keys.length || !boxes) return { x: 0, y: 0, w: W };
  const bs = keys.map((k) => boxes[KEYS.indexOf(String(k))]);
  const x0 = Math.min(...bs.map((b) => b.x)), y0 = Math.min(...bs.map((b) => b.y));
  const x1 = Math.max(...bs.map((b) => b.x + b.width)), y1 = Math.max(...bs.map((b) => b.y + b.height));
  const w = Math.max(x1 - x0, (y1 - y0) * W / H) * 1.25;
  return { w, x: (x0 + x1) / 2 - w / 2, y: (y0 + y1) / 2 - (w * H / W) / 2 };
}
marea.addEventListener("change", () => { if (marea.value) animateTo(fitKeys(AREAS[marea.value][1])); });
msvg.addEventListener("pointermove", () => { if (dragged) clearArea(); });
msvg.addEventListener("wheel", (e) => { if (e.ctrlKey || e.metaKey) clearArea(); });
msvg.addEventListener("dblclick", clearArea);
for (const id of ["zin", "zout", "zreset"]) document.getElementById(id).addEventListener("click", clearArea);

// Color modes and panel
const mmode = document.getElementById("mmode");
function paint() {
  const m = MODES[mstate.mode];
  shapePaths.forEach((p) => { const d = byKey.get(p.dataset.k); p.style.fill = d ? m.fill(d) : OFF; });
  mmode.innerHTML = Object.entries(MODES).map(([k, v]) => `<button type="button" class="pill${k === mstate.mode ? " active" : ""}" data-mode="${k}" aria-pressed="${k === mstate.mode}">${v.label}</button>`).join("");
  document.getElementById("mlegend").innerHTML = m.legend() + offKey() + (mstate.arrows ? arrowLegend() : "");
}
function arrowLegend() {
  const steps = [2, 5, 10, 15, 20, 25, 30, 40, 50].filter((s) => s <= maxShift);
  const sizes = [...new Set([steps[0], steps[Math.floor(steps.length / 2)], steps[steps.length - 1]])].filter(Boolean);
  let x = 0;
  const arrows = sizes.map((s) => {
    const len = arrowPx(s), w = len * Math.cos(ARROW_ANGLE), slot = Math.max(w + 8, 34), x0 = x + slot / 2 + w / 2, y0 = 22;
    x += slot + 4;
    return `<path d="${arrowPath(x0, y0, s, 1)}" fill="none" stroke="var(--text2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="${x0 - w / 2}" y="${y0 + 12}" text-anchor="middle" font-size="10" fill="var(--text3)">${s} pts</text>`;
  }).join("");
  return `<span class="key"><svg width="${x}" height="36" aria-hidden="true">${arrows}</svg>Arrow length: size of the shift</span>`;
}
mmode.addEventListener("click", (e) => { const k = e.target.closest("[data-mode]")?.dataset.mode; if (k) { mstate.mode = k; paint(); } });
document.getElementById("marrows").addEventListener("change", (e) => { mstate.arrows = e.target.checked; paint(); applyView(); });

const yearHtml = (y, r) => `
  <div class="mc">
    <div class="line small"><span class="yr">${y}</span><span>${resultShort(r)}</span></div>
    ${r.field.map((c) => `<div class="line small"><span class="who"><i class="sw" style="background:${partyVar(c.party)}"></i><span class="nm${c.won ? " won" : ""}" title="${esc(c.name)}">${esc(c.name)}</span></span><span class="num muted" style="white-space:nowrap">${c.pct.toFixed(1)}%</span></div>`).join("")}
  </div>`;
function renderPanel() {
  const k = mstate.hover ?? mstate.pinned;
  const d = k && byKey.get(k);
  hovPath.setAttribute("d", mstate.hover && mstate.hover !== mstate.pinned ? SHAPES[mstate.hover] : "");
  selPath.setAttribute("d", mstate.pinned ? SHAPES[mstate.pinned] : "");
  if (!d) { mpanel.innerHTML = `<p class="small muted">Hover over or tap a ${UNIT} to compare its ${Y0} and ${Y1} results and see which way it moved.</p>`; return; }
  const shift = d.comparable ? `
    <div class="mc">
      <span class="shiftv ${PARTY_CLASS[toward(d.shift)]}">${Math.abs(d.shift).toFixed(1)} pts toward ${towardWord(d.shift)}</span>
      <span class="small muted num">${leanText(d.a.dLead)} in ${Y0} to ${leanText(d.b.dLead)} in ${Y1}</span>
      ${trackHtml(d)}
      <div class="tl"><span>D +${RANGE}</span><span>Tie</span><span>R +${RANGE}</span></div>
    </div>` : `<p class="small muted">No shift measured: there was no Democrat vs. Republican race in ${missingYears(d)}.</p>`;
  const flip = d.flipped ? `<p class="small"><span class="tag flip-${d.b.winner.party}" style="margin-left:0">flipped</span> ${PARTY_NAME[d.a.winner.party]} in ${Y0}, ${PARTY_NAME[d.b.winner.party]} in ${Y1}</p>` : "";
  const sub = PAGE.panelSub ? `<p class="small muted">${PAGE.panelSub(d)}</p>` : "";
  mpanel.innerHTML = `
    <div><h3 style="margin:0">${esc(PAGE.name(d.k))}</h3>${sub}${flip}</div>
    ${shift}
    ${yearHtml(Y0, d.a)}${yearHtml(Y1, d.b)}
    <div class="line small"><span class="muted">Votes cast</span><span class="num">${num(d.a.cast)} to ${num(d.b.cast)} <span class="faint">(${turnoutText(d.turnout)})</span></span></div>`;
}
msvg.addEventListener("pointerover", (e) => { if (e.pointerType === "mouse") { mstate.hover = keyOf(e); renderPanel(); } });
msvg.addEventListener("pointerleave", (e) => {
  // Touch ends often fire pointerleave; keep the pinned panel visible.
  if (e.pointerType === "touch") return;
  mstate.hover = null; renderPanel();
});
msvg.addEventListener("click", (e) => {
  if (touchHandled) { touchHandled = false; return; }
  const k = keyOf(e); if (k && !dragged) mapPin(k);
});
msvg.addEventListener("focusin", (e) => { mstate.hover = keyOf(e); renderPanel(); });
msvg.addEventListener("focusout", () => { mstate.hover = null; renderPanel(); });
msvg.addEventListener("keydown", (e) => {
  const k = keyOf(e);
  if (k && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); mapPin(k); }
});
function mapPin(k) { mstate.pinned = k; renderPanel(); }
function showOnMap(k) {
  mapPin(k);
  mapEl.scrollIntoView({ behavior: reduceMotion.matches ? "auto" : "smooth", block: "center" });
}
paint();

// Table
const state = { filter: "all", sort: "key", q: "" };
const FILTERS = [["all", "All"], ["comparable", "D vs. R both years"], ["flipped", "Flipped"], ["toD", "Moved toward D"], ["toR", "Moved toward R"], ["none", "No shift measured"]]
  .filter(([k]) => unmeasured || (k !== "comparable" && k !== "none"));
const matches = (d, k) => k === "all" ? true
  : k === "comparable" ? d.comparable
  : k === "flipped" ? d.flipped
  : k === "toD" ? d.comparable && d.shift > 0
  : k === "toR" ? d.comparable && d.shift < 0
  : !d.comparable;
const count = (k) => UNITS.filter((d) => matches(d, k)).length;
const pills = document.getElementById("pills");
function renderPills() {
  pills.innerHTML = FILTERS.map(([k, l]) => `<button type="button" class="pill${state.filter === k ? " active" : ""}" data-f="${k}" aria-pressed="${state.filter === k}">${l} (${count(k)})</button>`).join("");
}
pills.addEventListener("click", (e) => { const k = e.target.closest("[data-f]")?.dataset.f; if (k) { state.filter = k; renderPills(); renderRows(); } });
const unmeasuredLast = (a, b) => (a.comparable ? 0 : 1) - (b.comparable ? 0 : 1);
const unopposedLast = (a, b) => (a.b.runnerUp ? 0 : 1) - (b.b.runnerUp ? 0 : 1);
const SORTS = {
  key: [`Sort: ${PAGE.kind === "county" ? "county name" : "district number"}`, byKeyOrder],
  toD: ["Sort: biggest shift toward D", (a, b) => unmeasuredLast(a, b) || b.shift - a.shift],
  toR: ["Sort: biggest shift toward R", (a, b) => unmeasuredLast(a, b) || a.shift - b.shift],
  close1: [`Sort: closest ${Y1} result`, (a, b) => unopposedLast(a, b) || a.b.marginPct - b.b.marginPct],
  turnout: ["Sort: biggest drop in votes cast", (a, b) => a.turnout - b.turnout],
};
const sortSel = document.getElementById("sort");
sortSel.innerHTML = Object.entries(SORTS).map(([k, [l]]) => `<option value="${k}">${esc(l)}</option>`).join("");
const W_COL = PAGE.winnerWord;
document.getElementById("thead").innerHTML = `<th>${esc(PAGE.colUnit)}</th><th>${Y0} ${W_COL}</th><th class="r">${Y0} margin</th><th>${Y1} ${W_COL}</th><th class="r">${Y1} margin</th><th class="r">Shift</th><th class="r">Votes cast ${Y0}</th><th class="r">Votes cast ${Y1}</th><th class="r">Change</th>`;
const winnerCell = (y, r, tag = "") => `<td data-l="${y}: "><i class="sw" style="background:${partyVar(r.winner.party)}"></i>${esc(r.winner.name)}${tag}</td>`;
function renderRows() {
  const qv = state.q.trim().toLowerCase();
  let list = UNITS.filter((d) => matches(d, state.filter));
  if (qv) list = list.filter((d) => `${PAGE.name(d.k)} ${PAGE.short(d.k)} ${subLabel(d)} ${[...d.a.field, ...d.b.field].map((c) => c.name).join(" ")}`.toLowerCase().includes(qv));
  list.sort(SORTS[state.sort][1]);
  document.getElementById("rows").innerHTML = list.map((d) => `<tr>
    <td>${unitLink(d)}</td>
    ${winnerCell(Y0, d.a)}<td class="r">${resultShort(d.a)}</td>
    ${winnerCell(Y1, d.b, flipTag(d))}<td class="r">${resultShort(d.b)}</td>
    <td class="r">${shiftHtml(d)}</td>
    <td class="r num">${num(d.a.cast)}</td><td class="r num">${num(d.b.cast)}</td>
    <td class="r num muted" data-l="Votes cast vs. ${Y0}: ">${turnoutText(d.turnout)}</td></tr>`).join("") || '<tr><td colspan="9" class="faint">No matches.</td></tr>';
}
const openUnit = (e) => {
  const k = e.target.closest?.("[data-k]")?.dataset.k;
  if (k) showOnMap(k);
};
const openOnKey = (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.closest?.("[data-k]")) { e.preventDefault(); openUnit(e); } };
for (const id of ["rows", "swing"]) {
  document.getElementById(id).addEventListener("click", openUnit);
  document.getElementById(id).addEventListener("keydown", openOnKey);
}
q.addEventListener("input", (e) => { state.q = e.target.value; renderRows(); });
sortSel.addEventListener("change", (e) => { state.sort = e.target.value; renderRows(); });

renderPills(); renderRows();
const lead = [...flips].filter((d) => d.comparable).sort((a, b) => b.shift - a.shift)[0] ?? [...comp].sort((a, b) => b.shift - a.shift)[0];
mapPin(lead.k);
})();
</script>
</body>
</html>
